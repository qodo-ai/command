name: Qodo Command Action
description: Retired legacy Qodo Command Action
author: Qodo
inputs:
  prompt:
    description: The prompt or command to run with Qodo
    required: true
  model:
    description: Specify a custom model to use
    required: false
  agent-file:
    description: Path to custom agent.toml file (defaults to the example agent.toml included with this
      action)
    required: false
  agentfile:
    description: 'DEPRECATED: Use agent-file instead. Path to custom agent.toml file'
    required: false
    deprecationMessage: The agentfile input has been deprecated. Please use agent-file instead.
  key-value-pairs:
    description: 'Additional key-value pairs as JSON object or multiline string (e.g., {"key1": "value1",
      "key2": "value2"} or key1=value1 key2=value2)'
    required: false
  qodo-version:
    description: Version of @qodo/command to install (defaults to latest)
    required: false
    default: latest
runs:
  using: composite
  steps:
  - name: Command permanently retired
    shell: bash
    run: 'echo "::error::The legacy Qodo Command Action is permanently retired. Use a supported integration
      with the current Qodo CLI."

      exit 1

      '
branding:
  icon: cpu
  color: blue
