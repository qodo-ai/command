name: Command retirement guard

on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load approved base retirement policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .retirement-policy
          persist-credentials: false
      - name: Verify permanent retirement
        run: |
          python3 -m venv /tmp/command-retirement-check
          /tmp/command-retirement-check/bin/pip install PyYAML==6.0.3
          COMMAND_RETIREMENT_ROOT="$PWD" /tmp/command-retirement-check/bin/python .retirement-policy/tests/retirement/test_retirement.py -v
